name: Aggiorna feed

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore
  workflow_dispatch:          # avvio manuale dal tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python build_feed.py
      - name: Salva il feed aggiornato
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Aggiorna feed" && git push)
